# Configuration for the Whitaker Dylint suite (see `make lint-whitaker`).

[bumpy_road_function]
# The suite charges compiler desugarings as authored structure, so the
# two-arm `ControlFlow` match that rustc lowers `?` to is scored in full: each
# arm contributes its nesting depth and its control-flow weight. A run of `?`
# operators a few lines apart therefore registers as a "bumpy road", although
# it expresses error propagation rather than nested conditional logic, and the
# `?` cannot be removed without breaking `clippy::question_mark` and the
# error-handling policy in `docs/developers-guide.md`.
#
# Raising the threshold separates the two: a desugared `?` cluster charges two
# arms on the line that carries the `?`, while genuine nesting accumulates
# depth, branch predicates, and per-arm flow across the whole region, so real
# `if`/`match`/loop nesting still crosses the threshold. Hosted CI reports the
# bumps that survive against this value, so the separation stays observable
# rather than assumed; re-read that report before changing the number.
threshold = 4.0

[no_std_fs_operations]
excluded_paths = [
    # The command module opens the input path supplied by the user. This is
    # the CLI's intentional ambient boundary; provider reader constructors
    # remain capability-clean.
    "chutoro_cli::cli::commands",
    # These test-only modules stage CLI inputs as real files for command tests.
    "chutoro_cli::cli::tests::test_helpers",
    "chutoro_cli::cli::tests::test_fixtures",
    # Dense provider convenience constructor: this private adapter opens a
    # caller-supplied ambient path. The provider and its reader constructor
    # remain capability-clean.
    "chutoro_providers_dense::parquet_path",
    # Benchmark report writers create their caller-selected output directories
    # and files for quality, profiling, and recall results.
    "chutoro_benches::clustering_quality",
    "chutoro_benches::profiling",
    "chutoro_benches::recall",
    # The sampler reads Linux's ambient `/proc/self/status` interface.
    "chutoro_benches::profiling::memory_sampler",
    # MNIST caching downloads and atomically updates an ambient cache path;
    # its tests clean up the same staged cache directory.
    "chutoro_benches::source::mnist",
    "chutoro_benches::source::mnist::tests",
]
excluded_crates = [
    # Integration test crates for the CI gate binaries: they stage gate
    # input files in ambient temp directories and spawn the binaries
    # against them.
    "kani_nightly_gate_cli",
    "benchmark_regression_gate_cli",
    # CI gate binaries (chutoro-test-support/src/bin): read gate input
    # files from workflow-provided ambient runner paths by design.
    "kani_nightly_gate",
    "benchmark_regression_gate",
]
