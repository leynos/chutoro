schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  '\bCARGO_TERM_COLOR\b',
  # Inline code spans are masked; the shared dictionary does not mask them yet.
  '`[^`\n]+`',
  'Header-only C\+\+/python library for fast approximate\s+nearest neighbors',
  # Preserve the public compatibility alias, not unrelated -ise prose.
  '\bpub const fn canonicalise\b',
  '\bedge\.canonicalise\b',
  # Existing benchmark CSV consumers depend on these exact output names.
  '\blane_utilisation_basis_points\b',
  '\bneighbour_scoring_lane_utilisation\.csv\b',
]

[files]
exclude = []
