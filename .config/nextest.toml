# .config/nextest.toml
# The tests that start a compiler use serial groups, so nested builds do not
# compete for cores or the package-cache lock (the Concordat rule).
# Setup scripts are experimental in the nextest versions the coverage action may
# install, so the configuration opts in; newer versions accept the entry.
experimental = ["setup-scripts"]

# Fetch the locked dependencies before any test starts, so a nested Cargo build in a
# test does not resolve them while holding the shared package-cache lock (NC-008).
[scripts.setup.fetch-locked]
command = "cargo fetch --locked"

[[profile.default.scripts]]
filter = "all()"
setup = "fetch-locked"

[[profile.ci.scripts]]
filter = "all()"
setup = "fetch-locked"

[test-groups]
# Every test that starts Cargo or rustc shares one serial slot.
nested-cargo = { max-threads = 1 }

[profile.default]
# Limit how many test binaries Nextest runs concurrently. When individual tests
# spawn internal thread pools (e.g., Rayon), tune this with RAYON_NUM_THREADS
# to avoid oversubscription.
test-threads = 8
# Kill any test once it crosses 60s.
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }

# Put a hard ceiling on the whole run.
global-timeout = "80m"

[[profile.default.overrides]]
# Criterion benchmarks run as test targets and need more than the default 60s
# timeout.  The HNSW n=5000 and diverse-source cases plus extraction
# benchmarks routinely exceed 60s under parallel load and can occasionally
# exceed 600s on shared runners.
filter = "package(chutoro-benches) & kind(bench)"
threads-required = 8
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# The largest extraction benchmark can exceed the generic 300s bench timeout on
# slower or more contended developer machines.
filter = "package(chutoro-benches) & test(/extract_labels\\//)"
threads-required = 8
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Some Criterion groups hang under nextest when multiple report-writing bench
# processes overlap on smaller machines, even though the binaries finish
# immediately when invoked directly.
filter = "package(chutoro-benches) & test(/edge_harvest_construction\\//)"
threads-required = 8
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Edge harvest property suite can run slower under heavy parallel load.
filter = "test(/edge_harvest_suite::/)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Idempotency proptest can exceed the default timeout under parallel load.
# Reserve all test slots so concurrent HNSW builds and nested Cargo tests do
# not starve this CPU-heavy property run.
filter = "test(/hnsw_idempotency_preserved_proptest/)"
threads-required = "num-test-threads"
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Edge harvest validity case_4 can exceed the default timeout under heavy
# instrumentation/load despite tiny input sizes.
filter = "test(/build_with_edges_returns_valid_edges::case_4/)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Edge harvest sort-order test can exceed the default timeout under coverage
# instrumentation due to the cost of a parallel HNSW build.
filter = "test(/build_with_edges_edges_sorted_by_sequence/)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Idempotency rstest case_4 can exceed 60s under llvm-cov instrumentation
# despite a tiny 16-vector fixture, matching the edge harvest case_4 precedent.
filter = "test(/idempotency_rstest_cases::case_4/)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Mutation proptest can exceed the default timeout under parallel load.
filter = "test(/hnsw_mutations_preserve_invariants_proptest/)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Search-vs-brute-force proptest can exceed the default timeout under CI load.
filter = "test(/hnsw_search_matches_brute_force_proptest/)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# The dense SIMD parity suite compares every enabled backend against the scalar
# oracle over generated vectors. It had no override in either profile, so the
# weekly lane's 25,000 forked cases inherited the 60s base and the slowest
# property was killed mid-case while its three siblings passed at 17s, 22s and
# 38s (run 34744512753, #264). 180s covers the pull-request lane's 250 cases
# with room for a deeper local run, and bounds a runaway case rather than
# letting it consume the whole run. The weekly and manual lanes select
# `property-heavy`, whose own entry carries the measured allowance.
filter = "package(chutoro-providers-dense) & test(/simd::tests::parity::/)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# This property builds HNSW indexes through both shared execution paths.
# Reserve half the test slots and allow for CPU contention on busy shared hosts.
filter = "test(/shared_execution_config_reaches_batch_and_session_paths/)"
threads-required = 4
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Write-lock proptest can exceed the default timeout under parallel load.
filter = "test(/generated_hnsw_scoring_does_not_run_inside_write_graph_scope/)"
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# The ARI/NMI baseline cases occasionally stall under heavy coverage load.
# Run these cases in isolation and fail fast so they cannot monopolize CI.
filter = "test(/hnsw_pipeline_matches_exact_baseline::case_/)"
threads-required = 4
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
retries = 1

[[profile.default.overrides]]
# Compile-contract tests build fixture crates with nested Cargo invocations.
# Share the nested-Cargo slot with other compiler-starting tests.
filter = "package(chutoro-compile-contracts)"
test-group = "nested-cargo"
threads-required = 4
slow-timeout = { period = "1800s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Benchmark smoke integration coverage runs nested cargo bench commands. Allow
# enough time for a cold release build to pass through shared compiler queues;
# one remained compiling beyond 900s on a six-core host.
filter = "test(/benchmark_binaries_cover_discovery_and_exact_smoke_paths/)"
threads-required = 8
slow-timeout = { period = "1800s", terminate-after = 1, grace-period = "5s" }

[profile.ci]
inherits = "default"
test-threads = 4

[[profile.ci.overrides]]
# Criterion benchmarks run as test targets and need more than the default 60s
# timeout.  The HNSW n=5000 and diverse-source cases plus extraction
# benchmarks routinely exceed 60s under parallel load.
filter = "package(chutoro-benches) & kind(bench)"
slow-timeout = { period = "900s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
# Edge harvest property suite can run slower under heavy parallel load.
filter = "test(/edge_harvest_suite::/)"
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
# Idempotency proptest can exceed the default timeout under parallel load.
filter = "test(/hnsw_idempotency_preserved_proptest/)"
threads-required = "num-test-threads"
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
# Sized from the first runs that ever executed. Until #260 these suites drew
# no cases at all, so the old 600s was never tested by a run that happens.
# Measured on runs 35077288750 and 35079377163: search completed its 25,000
# forked cases in 384s and 453s, and mutation reached a counterexample at
# 219s. 600s would have left search at three-quarters of its allowance on a
# hosted runner whose variance already puts the dense SIMD suite either side
# of its own ceiling (#264). 1500s is about three times the slowest observed
# run, and stays below the 2400s global timeout that bounds every per-test
# allowance.
filter = "test(/hnsw_mutations_preserve_invariants_proptest/)"
slow-timeout = { period = "1500s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
# Sized from measurement, as above: 384s and 453s for a completed 25,000-case
# forked run on runs 35077288750 and 35079377163.
filter = "test(/hnsw_search_matches_brute_force_proptest/)"
slow-timeout = { period = "1500s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
# The pull-request lane runs the dense SIMD parity suite at 250 cases, which
# finishes well inside this allowance, but both the base 60s and the profile
# were sized for other suites. Bounded here so a stuck case fails the lane
# instead of monopolizing it; the weekly and manual dense leg selects
# `property-heavy`, whose own entry carries the measured allowance.
filter = "package(chutoro-providers-dense) & test(/simd::tests::parity::/)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
# Write-lock proptest can exceed the default timeout under CI load.
filter = "test(/generated_hnsw_scoring_does_not_run_inside_write_graph_scope/)"
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }

[[profile.ci.overrides]]
# The ARI/NMI baseline cases occasionally stall under heavy coverage load.
# Run these cases in isolation and fail fast so they cannot monopolize CI.
filter = "test(/hnsw_pipeline_matches_exact_baseline::case_/)"
threads-required = 4
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
retries = 1

[[profile.ci.overrides]]
# Compile-contract tests build fixture crates with nested Cargo invocations.
# Share the nested-Cargo slot with other compiler-starting tests.
filter = "package(chutoro-compile-contracts)"
test-group = "nested-cargo"
threads-required = 4
slow-timeout = { period = "1800s", terminate-after = 1, grace-period = "5s" }

[[profile.default.overrides]]
# Tests that spawn Cargo or rustc run one at a time. Add a new spawner's binary here.
filter = "binary(dense_testing_feature) | binary(portable_simd_gating) | binary(result_api_surface) | binary(session_api_surface) | binary(error_code_api_surface) | binary(benchmark_smoke)"
test-group = "nested-cargo"

[profile.property-heavy]
inherits = "ci"
# The weekly and manual property lane. It inherits the CI profile's thread
# count, setup script and every other gate, and adds only the dense parity
# allowance sized for that lane's 25,000 forked cases. Nextest consults the
# selected profile's overrides before the inherited `ci` overrides, so the
# dense entry below replaces the 180s one rather than accompanying it.

[[profile.property-heavy.overrides]]
# Dense parity at the weekly lane's 25,000 forked cases. Measured on three
# forced `workflow_dispatch` runs of property-tests.yml (44915040254,
# 44915045535, 44915050995) on the x64 `ubuntu-latest` pool, with
# PROPTEST_CASES=25000, CHUTORO_PBT_FORK=true and the fixed seed
# 0x600D_5EED_C047_0207. Slowest completed duration per test across the three
# runs: pairwise 14.6s, non-finite pairwise 18.9s, query-to-points 37.3s and
# non-finite query-to-points 81.1s. The last is the sizing case: three times
# 81.1s is 243.4s, rounded up to a whole minute is 300s, about 3.7x the
# slowest observed run and far below the inherited 4800s global timeout.
# Timeouts are unresolved work, not completed measurements, so the 60s
# failures recorded in #264 are excluded from this sizing.
#
# Only the `dense_simd` matrix leg selects this profile. The pinned
# cargo-nextest 0.9.143 consults only the selected profile's own overrides
# and `profile.default`'s; overrides in an intermediate profile such as `ci`
# were silently skipped until 0.9.145, so selecting this profile for the
# whole weekly job would drop the 1500s HNSW allowances. The other legs stay
# on `ci` and keep the budgets they had.
filter = "package(chutoro-providers-dense) & test(/simd::tests::parity::/)"
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "5s" }
