name: Kani PR

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/kani-pr.yml"
      - "**/kani_*.rs"
      - "chutoro-core/src/hnsw/kani_proofs/**"
      - "chutoro-core/src/mst/kani_harness.rs"
      - "chutoro-providers/dense/src/simd/kani_proofs.rs"
      - "chutoro-core/src/hnsw/**"
      - "chutoro-core/src/mst/**"
      - "chutoro-providers/dense/src/simd/**"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "chutoro-core/Cargo.toml"
      - "chutoro-providers/dense/Cargo.toml"
      - "tools/kani/VERSION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kani-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kani:
    # Sizing experiment, to be resolved before this merges. Two cores ran
    # the suite in 641 s against a 630 s median on GitHub's four, so the
    # proof work looks effectively serial; four cores is measured here to
    # confirm that rather than assume it. See "Lane wall times before and
    # after the move" in docs/developers-guide.md.
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@95e90ba9e33eaeb3c8b4bf6ed1dbe1d7184ee710
        with:
          use-sccache: 'false'
      - name: Install Kani
        run: scripts/install-kani.sh
      # Kani installs a verifier bundle and its own pinned nightly
      # toolchain, which is the largest thing this job puts on the disk and
      # the one input a smaller shape could run out of room for. The
      # reading is taken after the install and again at the end, so a
      # future shape change is argued from headroom rather than from the
      # wall time alone.
      - name: Record disk headroom after the Kani install
        run: df -h .
      - name: Run Kani practical suite
        run: make kani
      - name: Record disk headroom after the suite
        if: ${{ always() }}
        run: df -h .
