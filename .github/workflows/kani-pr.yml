name: Kani PR

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/kani-pr.yml"
      - "**/kani_*.rs"
      - "chutoro-core/src/hnsw/kani_proofs/**"
      - "chutoro-core/src/mst/kani_harness.rs"
      - "chutoro-providers/dense/src/simd/kani_proofs.rs"
      - "chutoro-core/src/hnsw/**"
      - "chutoro-core/src/mst/**"
      - "chutoro-providers/dense/src/simd/**"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kani-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@a42afcf10cf18a6af7c6c2ec2b30c4209bc8c8cd
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run Kani practical suite
        run: make kani
