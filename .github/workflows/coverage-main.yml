name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push, and this is the only
# workflow that may talk to CodeScene or hold its credential. Pull
# requests measure coverage against the ratchet in ci.yml and publish
# nothing; see "Who may publish coverage" in docs/developers-guide.md.
# This workflow also advances the coverage ratchet baseline: caches
# saved on main are readable by every pull-request run, so the baseline
# written here is the one PR ratchet checks compare against.

'on':
  push:
    branches: [main]
  # Manual dispatch allows re-running the upload (and re-seeding the
  # ratchet baseline) without waiting for the next push to main.
  workflow_dispatch:

# Runs never cancel and never overlap. A cancelled publisher abandons its
# upload and the baseline write the next pull request reads. GitHub keeps
# one pending run per group, and the newest trigger replaces it, so a burst
# of pushes collapses to the newest. The group is keyed on the ref alone:
# keyed on the event too, an earlier dispatch could finish after a newer
# push and upload older coverage last.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubicloud-standard-2
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    # Above the 4,200 s cargo watchdog on the coverage step plus the 900 s
    # of work either side of it, and fifteen minutes above that sum rather
    # than equal to it. A ceiling sitting on its requirement cancels the
    # job at the moment the watchdog would have reported the overrun, and
    # the report is the only thing that makes an overrun actionable. This
    # was 85, exactly the requirement.
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # Pin Rayon to a single worker so the HNSW build is deterministic during
      # coverage. This baseline must be measured identically to the pull-request
      # check in ci.yml (which sets the same variable); otherwise the ratchet
      # would compare a deterministic PR measurement against a non-deterministic
      # baseline. See ci.yml for the full rationale.
      RAYON_NUM_THREADS: '1'
      # sccache is setup-rust's, on Ubicloud's cache proxy. Every compile here
      # is written to `main`'s scope, which is what a pull request's first
      # push reads. See "The compiler cache" in docs/developers-guide.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        id: setup-rust
        uses: leynos/shared-actions/.github/actions/setup-rust@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
        with:
          # This job runs only on Ubicloud, so a missing cache proxy fails it
          # loudly rather than letting it compile against local disk.
          expect-cache: ubicloud
      # The three steps below exist only to fill the cache. Ubicloud's proxy
      # is ref-scoped: ci.yml's build-test runs only on pull requests, and a
      # pull request reads `main`'s scope and its own, so this job, which
      # runs on every push to `main`, is what fills the scope a pull
      # request's first push reads. build-test compiles three different
      # shapes: the dense-SIMD gate with its own feature set, `make lint`'s
      # rustdoc and Clippy pass, and the instrumented coverage run. Writing
      # only the third left everything the other two build missing on every
      # pull request, which under the retired archive measured as a warm hit
      # rate stuck at 47.94 % with byte-identical counters across two
      # dispatches (runs 33921148583 and 33921943137).
      # `tests/workflow_contracts/sccache_cache_entry_test.py` asserts the
      # superset relation so the two cannot drift apart.
      #
      # The commands are duplicated from ci.yml rather than shared, because
      # YAML anchors do not cross files. The contract is what keeps them
      # equal.
      - name: Dense stable SIMD gating
        run: |
          cargo clippy -p chutoro-providers-dense \
            --all-targets \
            --no-default-features \
            --features simd_avx2,simd_avx512,simd_neon \
            -- -D warnings
          cargo test -p chutoro-providers-dense \
            --no-default-features \
            --features simd_avx2,simd_avx512,simd_neon
      # `make lint` runs the Whitaker Dylint suite, which needs the suite
      # installed. The shared action owns the installer binary and the
      # ~/.local/share/whitaker cache for this job.
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
      - name: Lint
        run: make lint
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
        env:
          # The cargo watchdog, one of four tiers that can end a run. It must
          # stay above the 40 m nextest global-timeout in .config/nextest.toml
          # plus the build that runs inside the same cargo invocation, or a
          # cold run is killed before nextest can use its budget. See "Test
          # timeouts: four tiers, outermost last" in docs/developers-guide.md.
          RUN_RUST_CARGO_WAIT_TIMEOUT: '4200'
        with:
          output-path: lcov.info
          format: lcov
          # chutoro#155: one test passes under nextest's process isolation
          # but fails under plain cargo test, so coverage stays on nextest.
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          # Setup Rust owns ~/.cargo/registry and ~/.cargo/git for this
          # job and restores them first. Leaving this action's cache
          # enabled would archive the same paths under a second key.
          cache-provider: external
      - name: Record compiler-cache statistics
        if: ${{ always() }}
        env:
          SCCACHE_BACKEND: ${{ steps.setup-rust.outputs.cache-backend }}
        run: |
          {
            printf '### sccache (coverage-upload)\n\n'
            printf -- '- backend: %s\n\n' "${SCCACHE_BACKEND:-none}"
            printf '```\n'
            "${SCCACHE_PATH:-sccache}" --show-stats
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Whether the credential exists, without putting it in any step's
      # `env`. The expression is evaluated before the shell runs, so the
      # command writes a literal `true` or `false` and holds no conditional.
      # The upload action is composite and hands its step's `env` to the
      # upload-artifact and cache steps nested inside it, so the token is
      # passed to it as an input and bound nowhere else.
      - name: Check the CodeScene credential is available
        id: codescene-credential
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # The trunk guard is a conjunct of its own because the dispatch
        # trigger above can be started from any branch, and CodeScene would
        # take that branch's report as the project's.
        if: steps.codescene-credential.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
        with:
          format: lcov
          project-url: https://api.codescene.io/v2/projects/71838
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
