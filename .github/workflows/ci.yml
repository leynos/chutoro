name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # A pull request from a fork cannot obtain an Ubicloud runner, so it
    # falls back to GitHub's hosted pool. Estate rule, 2026-09-15.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # Above the 4,200 s cargo watchdog on the coverage step plus the 900 s
    # of work either side of it, and fifteen minutes above that sum rather
    # than equal to it. A ceiling sitting on its requirement cancels the
    # job at the moment the watchdog would have reported the overrun, and
    # the report is the only thing that makes an overrun actionable. This
    # was 85, exactly the requirement.
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # Pin Rayon to a single worker so the HNSW build is deterministic during
      # coverage. `CpuHnsw::build` inserts nodes through `into_par_iter` and
      # `sample_level` draws from a per-worker RNG chosen by
      # `current_thread_index`, so multi-threaded scheduling varies both the
      # insertion order and the random draws, producing a different graph — and
      # therefore different covered lines — on each run. That made whole-workspace
      # coverage wobble run-to-run and false-tripped the ratchet. One worker keeps
      # the ratchet input reproducible and matched to the coverage-main baseline;
      # it controls coverage-ratchet determinism only. MST concurrency coverage
      # comes from a `std::thread` `try_union` stress test and an explicit
      # `ThreadPoolBuilder` 1-versus-8-thread determinism test, both of which use
      # real concurrency regardless of this pin.
      RAYON_NUM_THREADS: '1'
      # sccache is setup-rust's: it names the wrapper, starts and zeroes the
      # server, and picks the backend from the runner. On Ubicloud that is
      # the cache proxy, which a pull request reads from `main`'s scope and
      # its own; on the fork fallback's hosted runner it is a local
      # directory that setup-rust restores from `main` and never saves from a
      # pull request. See "The compiler cache" in docs/developers-guide.md.
    steps:
      # A shallow checkout, the action's default, because nothing in this job
      # reads history any more. The `cs-coverage check` step that needed the
      # pull request's merge base is gone, and the ratchet compares a
      # percentage against a cached baseline rather than a diff. Restoring
      # `fetch-depth: 0` needs a step that actually consumes the merge base;
      # it cannot be the CodeScene check, which now belongs to a push-only
      # workflow that has no pull request to find a merge base for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        id: setup-rust
        uses: leynos/shared-actions/.github/actions/setup-rust@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
        with:
          # `any`, because a fork's pull request falls back to a hosted runner,
          # where setup-rust selects local disk rather than failing the check.
          expect-cache: any
      - name: Dense stable SIMD gating
        run: |
          cargo clippy -p chutoro-providers-dense \
            --all-targets \
            --no-default-features \
            --features simd_avx2,simd_avx512,simd_neon \
            -- -D warnings
          cargo test -p chutoro-providers-dense \
            --no-default-features \
            --features simd_avx2,simd_avx512,simd_neon
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      # The shared action resolves a pinned prebuilt whitaker-installer
      # release and verifies its published digest, replacing the former
      # crates.io source-build fallback. It owns the installer binary and
      # the ~/.local/share/whitaker suite cache.
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
      - name: Lint
        run: make lint
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.14'
          # Setup Rust already invoked setup-uv with caching enabled, so it
          # owns ~/.cache/uv. Enabling the cache again here would give that
          # path a second owner with a competing key.
          enable-cache: false
      - name: Spelling
        run: make spelling
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
        env:
          # The cargo watchdog, one of four tiers that can end a run. It must
          # stay above the 40 m nextest global-timeout in .config/nextest.toml
          # plus the build that runs inside the same cargo invocation, or a
          # cold run is killed before nextest can use its budget. See "Test
          # timeouts: four tiers, outermost last" in docs/developers-guide.md.
          RUN_RUST_CARGO_WAIT_TIMEOUT: '4200'
        with:
          output-path: lcov.info
          format: lcov
          # chutoro#155: one test passes under nextest's process isolation
          # but fails under plain cargo test, so coverage stays on nextest.
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          # This lane measures and compares; it does not publish. The action
          # archives the report it generated under a step of its own, which no
          # scanner over this file's steps can see, so declining that archive
          # is the only way the boundary is observable here. The report stays
          # on the runner for the ratchet; `coverage-main.yml` keeps the
          # action's default and uploads.
          publish-artefact: 'false'
          # Setup Rust owns ~/.cargo/registry and ~/.cargo/git for this job
          # and restores them before the first build step. Leaving this
          # action's cache enabled would archive the same paths under a
          # second key, so it reads the already-restored Cargo home instead.
          cache-provider: external
      - name: Record compiler-cache statistics
        if: ${{ always() }}
        env:
          SCCACHE_BACKEND: ${{ steps.setup-rust.outputs.cache-backend }}
        run: |
          {
            printf '### sccache (build-test)\n\n'
            printf -- '- backend: %s\n\n' "${SCCACHE_BACKEND:-none}"
            printf '```\n'
            "${SCCACHE_PATH:-sccache}" --show-stats
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  verus-proofs:
    # A pull request from a fork cannot obtain an Ubicloud runner, so it
    # falls back to GitHub's hosted pool. Estate rule, 2026-09-15.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # Install into the gitignored workspace .verus directory rather than
      # RUNNER_TEMP so the cache archives a stable, predictable path.
      VERUS_INSTALL_DIR: ${{ github.workspace }}/.verus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Sole owner of .verus. The key is the pinned version plus the digest
      # manifest, so the only way to miss is to change the pin, and the
      # archive restored under a key can never disagree with its checksum.
      - name: Cache Verus
        id: verus-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.verus
          key: >-
            verus-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('tools/verus/VERSION', 'tools/verus/SHA256SUMS') }}
      - name: Install Verus
        run: scripts/install-verus.sh
      - name: Run Verus proofs
        run: make verus
        env:
          VERUS_BIN: ${{ github.workspace }}/.verus/verus/verus
      - name: Record Verus cache state
        if: ${{ always() }}
        env:
          VERUS_CACHE_HIT: ${{ steps.verus-cache.outputs.cache-hit }}
        run: |
          {
            printf '### Verus cache\n\n'
            printf -- '- restore hit: %s\n' "${VERUS_CACHE_HIT:-false}"
            printf -- '- size: %s\n' \
              "$(du -sh "${VERUS_INSTALL_DIR}" 2>/dev/null | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
