name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      # Pin Rayon to a single worker so the HNSW build is deterministic during
      # coverage. `CpuHnsw::build` inserts nodes through `into_par_iter` and
      # `sample_level` draws from a per-worker RNG chosen by
      # `current_thread_index`, so multi-threaded scheduling varies both the
      # insertion order and the random draws, producing a different graph — and
      # therefore different covered lines — on each run. That made whole-workspace
      # coverage wobble run-to-run and false-tripped the ratchet. One worker keeps
      # the ratchet input reproducible and matched to the coverage-main baseline.
      RAYON_NUM_THREADS: '1'
      # Name the wrapper at job level so every compiling step routes through
      # the cache, including the ones inside shared actions. Installing
      # sccache is not enough on its own; nothing else names it.
      RUSTC_WRAPPER: sccache
      # The local-disk arm. sccache's GitHub Actions backend was measured to
      # be a net loss for Rust here: a hit cost 0.28 s against 0.42 s to
      # compile, and GitHub rejected 273 of this job's writes, which pushed
      # the coverage step into the 600 s nextest timeout. A plain directory
      # under the workspace, moved by actions/cache, has no such per-object
      # round trip. The directory must sit inside the workspace so the cache
      # action's relative path resolves and .gitignore keeps it out of the
      # tree that coverage and CodeScene read.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      # Bound the archive. The GitHub cache allows 10 GB per repository and
      # the Verus cache already owns part of that, so an unbounded compiler
      # cache would evict its own neighbours.
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # cs-coverage check diffs the PR against its merge base, so the
          # full history must be fetched for the merge base to be reachable.
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@197d04cbc6f20cd7d1a08b4e445a5c35910e5364
        with:
          # The action installs sccache through mozilla-actions/sccache-action,
          # whose last act is to write ACTIONS_CACHE_SERVICE_V2=on and
          # GitHub's results URL and token to GITHUB_ENV. That clobbers any
          # earlier cache-endpoint export for every later step, which is how
          # the Ubicloud lane's writes ended up at GitHub. Keeping the step
          # out is what makes the local backend's indifference to those
          # variables count.
          use-sccache: 'false'
      # Pinned, checksum-verified release archive; nothing is built from
      # source in CI.
      - name: Install sccache
        run: scripts/install-sccache.sh
      # A cache key that never varies can be written once and never again:
      # actions/cache refuses to overwrite an existing key, so the entry
      # would freeze at the first push that used a given lockfile. The date
      # stamp gives the writer a fresh key each day while the restore-keys
      # prefix keeps readers on the newest entry. Computed once per job so
      # the restore and the save below cannot straddle midnight.
      - name: Stamp the compiler-cache key
        id: sccache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # Reader only. coverage-main.yml is the sole writer of this key: it
      # compiles the same workspace under the same instrumentation on push
      # to main. A second writer here would race it on every merge and the
      # loser's work would be discarded. The restore-keys prefix lets a run
      # whose lockfile has moved start from the newest older entry instead
      # of from nothing.
      - name: Restore compiler cache
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: >-
            sccache-build-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ steps.sccache-key.outputs.date }}
          restore-keys: |
            sccache-build-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            sccache-build-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      # Starts the server against SCCACHE_DIR and resets the counters, so
      # the statistics below describe this run alone.
      - name: Reset compiler-cache counters
        run: sccache --zero-stats
      - name: Dense stable SIMD gating
        run: |
          cargo clippy -p chutoro-providers-dense \
            --all-targets \
            --no-default-features \
            --features simd_avx2,simd_avx512,simd_neon \
            -- -D warnings
          cargo test -p chutoro-providers-dense \
            --no-default-features \
            --features simd_avx2,simd_avx512,simd_neon
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: |
            **/*.md
            !**/target/**
            !**/dist/**
      # The shared action resolves a pinned prebuilt whitaker-installer
      # release and verifies its published digest, replacing the former
      # crates.io source-build fallback. It owns the installer binary and
      # the ~/.local/share/whitaker suite cache.
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@197d04cbc6f20cd7d1a08b4e445a5c35910e5364
      - name: Lint
        run: make lint
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.14'
          # Setup Rust already invoked setup-uv with caching enabled, so it
          # owns ~/.cache/uv. Enabling the cache again here would give that
          # path a second owner with a competing key.
          enable-cache: false
      - name: Spelling
        run: make spelling
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@197d04cbc6f20cd7d1a08b4e445a5c35910e5364
        with:
          output-path: lcov.info
          format: lcov
          # chutoro#155: one test passes under nextest's process isolation
          # but fails under plain cargo test, so coverage stays on nextest.
          use-cargo-nextest: 'true'
          with-ratchet: 'true'
          # Setup Rust owns ~/.cargo/registry and ~/.cargo/git for this job
          # and restores them before the first build step. Leaving this
          # action's cache enabled would archive the same paths under a
          # second key, so it reads the already-restored Cargo home instead.
          cache-provider: external
      - name: Record compiler-cache statistics
        if: ${{ always() }}
        env:
          SCCACHE_RESTORE_HIT: ${{ steps.sccache-restore.outputs.cache-hit }}
          SCCACHE_RESTORE_KEY: ${{ steps.sccache-restore.outputs.cache-matched-key }}
        run: |
          {
            printf '### sccache (build-test)\n\n'
            printf -- '- cache service v2 selected: %s\n' \
              "${ACTIONS_CACHE_SERVICE_V2:-unset}"
            printf -- '- restore exact hit: %s\n' \
              "${SCCACHE_RESTORE_HIT:-false}"
            printf -- '- restored key: %s\n' \
              "${SCCACHE_RESTORE_KEY:-none}"
            printf -- '- cache size on disk: %s\n\n' \
              "$(du -sh "${SCCACHE_DIR}" 2>/dev/null | cut -f1)"
            printf '```\n'
            sccache --show-stats
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@197d04cbc6f20cd7d1a08b4e445a5c35910e5364
        with:
          format: lcov
          mode: check
          project-url: https://api.codescene.io/v2/projects/71838
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

  verus-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # Install into the gitignored workspace .verus directory rather than
      # RUNNER_TEMP so the cache archives a stable, predictable path.
      VERUS_INSTALL_DIR: ${{ github.workspace }}/.verus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Sole owner of .verus. The key is the pinned version plus the digest
      # manifest, so the only way to miss is to change the pin, and the
      # archive restored under a key can never disagree with its checksum.
      - name: Cache Verus
        id: verus-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.verus
          key: >-
            verus-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ hashFiles('tools/verus/VERSION', 'tools/verus/SHA256SUMS') }}
      - name: Install Verus
        run: scripts/install-verus.sh
      - name: Run Verus proofs
        run: make verus
        env:
          VERUS_BIN: ${{ github.workspace }}/.verus/verus/verus
      - name: Record Verus cache state
        if: ${{ always() }}
        env:
          VERUS_CACHE_HIT: ${{ steps.verus-cache.outputs.cache-hit }}
        run: |
          {
            printf '### Verus cache\n\n'
            printf -- '- restore hit: %s\n' "${VERUS_CACHE_HIT:-false}"
            printf -- '- size: %s\n' \
              "$(du -sh "${VERUS_INSTALL_DIR}" 2>/dev/null | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
