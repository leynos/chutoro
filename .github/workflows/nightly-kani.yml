name: Nightly Kani

'on':
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: Force Kani run even without last-24-hour commits (UTC).
        required: false
        default: true
        type: boolean

concurrency:
  group: nightly-kani
  cancel-in-progress: false

jobs:
  kani-full:
    # Nightly work stays GitHub-hosted: it is off the developer feedback
    # path and gains nothing from a shorter paid queue.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          install-mold: 'true'
          # Kani compiles through `kani-compiler`, which sccache does not
          # support, so the binary would be installed and never named.
          use-sccache: 'false'
          # Do not force `-D warnings` on this job. Under `cfg(kani)` the
          # proof-harness helpers in chutoro-core are only partly used, so
          # dead_code fires and denial turns it into a compilation error that
          # has nothing to do with verification. Warning denial stays where it
          # belongs, on ci.yml's lint and build steps.
          rustflags: ''
      - name: Decide whether to run Kani
        id: gate
        env:
          CHUTORO_KANI_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_run || 'false' }}
        run: cargo run -p chutoro-test-support --bin kani_nightly_gate
      # Deliberately uncached. Kani is a multi-part tool, so a cache would
      # have to cover the front-end, the verifier bundle under KANI_HOME, and
      # the pinned nightly toolchain together, which measures about 1.8 GB. A
      # cold install of all three takes 16 s on a GitHub runner (run
      # 33819842254), so the archive would cost more to move than the work it
      # avoids and would consume most of the repository's cache quota.
      # `make install-kani` delegates to the pinned rust-prover-tools release,
      # which verifies both archives against its own SHA-256 pins and repeats
      # the download only when an executable is missing.
      - name: Setup uv for the prover tooling
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.14'
          # Setup Rust already invoked setup-uv with caching enabled, so it
          # owns ~/.cache/uv. Enabling the cache again here would give that
          # path a second owner with a competing key.
          enable-cache: false
      - name: Install Kani
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: make install-kani
      - name: Run Kani full suite
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: make kani-full
