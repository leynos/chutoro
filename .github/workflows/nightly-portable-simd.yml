name: Nightly Portable SIMD

'on':
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: Force the nightly portable SIMD run without a recent main commit.
        required: false
        default: true
        type: boolean

concurrency:
  group: nightly-portable-simd
  cancel-in-progress: false

jobs:
  nightly-portable-simd:
    # Nightly work stays GitHub-hosted. It is off the developer feedback
    # path, so it gains nothing from a shorter paid queue, and
    # namespace-profile-default's 4 vCPU/16 GB shape exceeds the estate's
    # 4 vCPU/8 GB ceiling.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Decide whether to run nightly portable SIMD
        id: gate
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_run || 'false' }}
        run: |
          if [ "${FORCE_RUN}" = "true" ]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

          now_epoch="$(date -u +%s)"
          commit_epoch="$(git log -1 --format=%ct origin/main)"
          if [ $((now_epoch - commit_epoch)) -le 86400 ]; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
          fi
      # Each component needs its own flag. `--component clippy rustfmt`
      # reads `rustfmt` as a second toolchain name and rustup exits 1, so
      # this lane has never once run the steps below it: on a day the gate
      # fires it dies here, and on every other day the gate skips the work
      # and the run reports success in seconds. See #262.
      - name: Install nightly Rust
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: |
          rustup toolchain install nightly --profile minimal \
            --component clippy --component rustfmt
      # The trybuild gating test is excluded here, and only here. Its
      # expected output pins stable's refusal to compile `std::simd` without
      # the feature; on nightly rustc adds one line to each of those errors,
      # `help: add #![feature(portable_simd)] to the crate attributes to
      # enable`, because on nightly it can be. The fixture then mismatches on
      # four errors for a reason that is about the toolchain rather than about
      # the gating it asserts. Carrying a second fixture, or normalising the
      # help line away, would buy maintenance for no coverage: the check
      # exists to prove the stable refusal, which CI already runs. See #262.
      - name: Test dense portable SIMD backend
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: |
          cargo +nightly test -p chutoro-providers-dense \
            --features nightly_portable_simd \
            -- --skip portable_simd_without_feature_is_rejected
      - name: Lint dense portable SIMD backend
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: cargo +nightly clippy -p chutoro-providers-dense --all-targets --features nightly_portable_simd -- -D warnings
