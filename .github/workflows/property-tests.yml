name: Property Tests

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/property-tests.yml"
      - ".config/nextest.toml"
      - "chutoro-core/**"
      - "chutoro-providers/dense/**"
      - "chutoro-test-support/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  CARGO_NEXTEST_VERSION: "0.9.143"

jobs:
  property-tests-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubicloud-standard-8
    # Keep this above the 600-second HNSW idempotency nextest timeout so setup
    # and the earlier property tests do not consume the whole job budget.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [hnsw, edge_harvest, mst, dense_simd]
    env:
      CARGO_TERM_COLOR: always
      PROGTEST_CASES: "250"
      PROPTEST_CASES: "250"
      CHUTORO_PBT_FORK: "false"
      PROPTEST_FORK: "false"
      CHUTORO_HNSW_PBT_MIN_RECALL: "0.60"
      CHUTORO_HNSW_PBT_MIN_MAX_CONNECTIONS: "12"
    steps:
      - &checkout_step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - &setup_rust_step
        name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@32c8ea649ea44d40119f348ad48861212532061f
      - &cache_nextest_step
        name: Cache cargo-nextest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-nextest
            ~/.cache/cargo-binstall
          key: cargo-nextest-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_NEXTEST_VERSION }}
      - &install_nextest_step
        name: Install cargo-nextest
        run: cargo binstall --no-confirm --locked "cargo-nextest@${CARGO_NEXTEST_VERSION}"
      - &run_property_suite_step
        name: Run property suite
        run: |
          set -o pipefail
          case "${{ matrix.suite }}" in
            hnsw)
              cargo nextest run --profile ci -p chutoro-core \
                hnsw::tests::property::tests::hnsw_search_matches_brute_force_proptest \
                hnsw::tests::property::tests::hnsw_mutations_preserve_invariants_proptest \
                hnsw::tests::property::tests::hnsw_idempotency_preserved_proptest \
                2>&1 | tee /tmp/property-${{ matrix.suite }}.log
              ;;
            edge_harvest)
              cargo nextest run --profile ci -p chutoro-core \
                hnsw::tests::property::edge_harvest_suite:: \
                hnsw::tests::property::edge_harvest_output::suite:: \
                2>&1 | tee /tmp/property-${{ matrix.suite }}.log
              ;;
            mst)
              cargo nextest run --profile ci -p chutoro-core \
                mst::property::tests:: \
                2>&1 | tee /tmp/property-${{ matrix.suite }}.log
              ;;
            dense_simd)
              cargo nextest run --profile ci -p chutoro-providers-dense \
                simd::tests::parity:: \
                2>&1 | tee /tmp/property-${{ matrix.suite }}.log
              ;;
            *)
              echo "unknown property suite: ${{ matrix.suite }}" >&2
              exit 1
              ;;
          esac
      - &upload_proptest_regressions_step
        name: Upload proptest regressions
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proptest-regressions-${{ matrix.suite }}
          path: |
            **/proptest-regressions/**
            /tmp/property-${{ matrix.suite }}.log

  property-tests-weekly:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubicloud-standard-8
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [hnsw, edge_harvest, mst, dense_simd]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      PROGTEST_CASES: "25000"
      PROPTEST_CASES: "25000"
      CHUTORO_PBT_FORK: "true"
      PROPTEST_FORK: "true"
      CHUTORO_HNSW_PBT_MIN_RECALL: "0.60"
      CHUTORO_HNSW_PBT_MIN_MAX_CONNECTIONS: "12"
    steps:
      - *checkout_step
      - *setup_rust_step
      - *cache_nextest_step
      - *install_nextest_step
      - *run_property_suite_step
      - *upload_proptest_regressions_step
