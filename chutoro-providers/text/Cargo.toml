[package]
name = "chutoro-providers-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UTF-8 text data source with Levenshtein distance for chutoro clustering."
keywords = ["clustering", "levenshtein", "text", "strings", "fishdbc"]
categories = ["algorithms", "text-processing"]

[dependencies]
[dependencies.strsim]
version = "0.11.1"
[dependencies.thiserror]
version = "2.0.17"
[dependencies.chutoro-core]
version = "0.1.0-beta1"
path = "../../chutoro-core"
default-features = false
features = ["skeleton"]

[dev-dependencies]
rstest = "0.28"

[lints]
workspace = true
