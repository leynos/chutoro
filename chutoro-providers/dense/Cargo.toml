[package]
name = "chutoro-providers-dense"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Parquet and Arrow dense-vector data source for chutoro clustering."
keywords = ["clustering", "parquet", "arrow", "embeddings", "fishdbc"]
categories = ["algorithms", "science"]

[features]
default = ["simd_avx2", "simd_avx512", "simd_neon"]
nightly_portable_simd = []
simd_avx2 = []
simd_avx512 = []
simd_neon = []

[dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
thiserror = "2.0.17"
[dependencies.chutoro-core]
version = "0.1.0-beta1"
path = "../../chutoro-core"
default-features = false
features = ["skeleton"]

[build-dependencies]
mockable = { workspace = true }
[dev-dependencies]
bytes = "1.10"
proptest = "1.8.0"
rstest = "0.28"
test-strategy = "0.4.3"

[dev-dependencies.chutoro-test-support]
path = "../../chutoro-test-support"

[lints]
workspace = true
