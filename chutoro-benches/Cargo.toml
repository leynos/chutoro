[package]
name = "chutoro-benches"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
camino = "1.2.2"
cap-std = { version = "3.4.5", features = ["fs_utf8"] }
chutoro-core = { path = "../chutoro-core" }
chutoro-providers-dense = { path = "../chutoro-providers/dense" }
criterion = { version = "0.5.1", features = ["html_reports"] }
flate2 = "1.1.9"
rand = { version = "0.9.5", features = ["small_rng"] }
strsim = "0.11.1"
thiserror = "2.0.17"
ureq = "3.2.0"

[dev-dependencies]
proptest = "1.8.0"
rstest = "0.26"
tempfile = "3.10"

[[bench]]
name = "hnsw"
harness = false

[[bench]]
name = "hnsw_ef_sweep"
harness = false

[[bench]]
name = "edge_harvest"
harness = false

[[bench]]
name = "mst"
harness = false

[[bench]]
name = "extraction"
harness = false

[[bench]]
name = "neighbour_scoring"
harness = false

[lints]
workspace = true
