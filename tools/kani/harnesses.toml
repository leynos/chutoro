tier = "full"

[[harness]]
package = "chutoro-core"
pretty_name = "distance::kani_proofs::verify_euclidean_non_negative_3d"
tier = "full"

[[harness]]
package = "chutoro-core"
pretty_name = "distance::kani_proofs::verify_euclidean_symmetry_3d"
tier = "full"

[[harness]]
package = "chutoro-core"
pretty_name = "distance::kani_proofs::verify_euclidean_zero_on_identical_3d"
tier = "full"

