# Inventory of every Kani proof declaration in this repository.
#
# This file is the single classification of the proof surface. The
# workflow-contract suite binds it to the `#[kani::proof]` declarations in the
# tree and to the Makefile selectors, and the `kani_suite` checker requires a
# Kani run to complete exactly the harnesses listed here for the package and
# tier it was asked to verify.
#
# Fields:
#
# - `package`     the Cargo package the declaration is compiled into, as the
#                 `-p` selector names it;
# - `pretty_name` the fully qualified harness path Kani prints in its
#                 `Checking harness <name>...` line, which is also what
#                 `--harness <name> --exact` selects;
# - `tier`        `fast` for the pull-request tier (`make kani`), or `full`
#                 for proofs that run only in the nightly package sweep
#                 (`make kani-full`).
#
# A harness added to the tree must be added here in the same change, with its
# tier decided explicitly. The contract test reports an added declaration, a
# removed manifest entry and a duplicate identity separately, so an omission
# cannot pass as an empty surface.

version = 1

# chutoro-core: distance kernel proofs. Full tier: they were never part of the
# curated pull-request set, and the fast tier is deliberately kept to proofs
# that complete quickly.
[[harness]]
package = "chutoro-core"
pretty_name = "distance::kani_proofs::verify_cosine_bounded_3d"
tier = "full"

[[harness]]
package = "chutoro-core"
pretty_name = "distance::kani_proofs::verify_cosine_symmetry_3d"
tier = "full"

[[harness]]
package = "chutoro-core"
