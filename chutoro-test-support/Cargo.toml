[package]
name = "chutoro-test-support"
version = "0.1.0"
edition = "2024"

[dependencies]
mockable = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.17"
toml = "1.1.4"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.20", features = ["fmt", "registry"] }

[dev-dependencies]
mockable = { workspace = true, features = ["mock"] }
proptest = "1.8.0"
rstest = "0.28"

[lints]
workspace = true
